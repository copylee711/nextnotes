# NextNotes: build a signed APK and publish it as a GitHub Release when a vX.Y.Z tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and CMake the native build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" > /dev/null

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but versionName $version"; exit 1; }

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXTNOTES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXTNOTES_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "NEXTNOTES_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=nextnotes"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew --no-daemon :ai:testDebugUnitTest assembleRelease

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="NextNotes-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # Hand-written notes, when there are any, are what the in-app update prompt shows.
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "NextNotes $GITHUB_REF_NAME" "$@"

      - name: Keep the APK of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NextNotes-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove the signing key
        if: always()
        run: rm -f app/release.jks keystore.properties
